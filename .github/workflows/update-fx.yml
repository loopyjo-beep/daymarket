# 평일 하루 두 번(한국 시간 12:10, 18:10) 한국은행 ECOS 원/달러 매매기준율을 받아 data/usdkrw.json을 갱신한다.
# 필요: 저장소 Settings > Secrets and variables > Actions 에 ECOS_KEY 등록
name: update-fx
on:
  schedule:
    - cron: '10 3 * * 1-5'
    - cron: '10 9 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch ECOS USD/KRW
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: node scripts/fetch-usdkrw.mjs
      - name: Commit if changed
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add data/usdkrw.json
          git diff --cached --quiet || (git commit -m "환율 갱신 $(date -u +%F)" && git push)
