# 안드로이드 앱을 빌드한다.
# - 테스트용 APK(debug): 항상 만들어 Releases의 "android-latest"에 올린다. 휴대폰에서 받아 바로 설치해 볼 수 있다.
# - 스토어용 AAB(release): 서명 키 비밀값(ANDROID_KEYSTORE_BASE64 등)이 있을 때만 만든다.
name: android
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'scripts/build-web.mjs'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Prepare web files
        run: node scripts/build-web.mjs
      - name: Create Android project
        run: npx cap add android
      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Set version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/daymarket-debug.apk
      - name: Build signed release AAB (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "서명 키 비밀값이 없어 스토어용 AAB는 건너뜀"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          cp app/build/outputs/bundle/release/app-release.aab ../dist/daymarket-release.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: daymarket-android-${{ github.run_number }}
          path: dist/
      - name: Publish test APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="테스트용 빌드 0.1.${{ github.run_number }} ($(date -u +%F)). 휴대폰에서 daymarket-debug.apk를 받아 설치하세요. 스토어 배포용이 아닙니다."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest --prerelease --title "안드로이드 테스트 빌드" --notes "$NOTES"
          fi
          gh release upload android-latest dist/daymarket-debug.apk --clobber
